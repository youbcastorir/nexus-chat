<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXUS — AI Chat Interface</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <!-- Ambient background -->
  <div class="ambient">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="grid-overlay"></div>
  </div>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <span class="logo-mark">N</span>
        <span class="logo-text">NEXUS</span>
      </div>
      <button class="sidebar-toggle" id="sidebarToggle" title="Toggle sidebar">
        <span></span><span></span>
      </button>
    </div>

    <button class="new-chat-btn" id="newChatBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      New Conversation
    </button>

    <div class="sidebar-section-label">RECENT</div>
    <nav class="chat-history" id="chatHistory">
      <!-- dynamically filled -->
    </nav>

    <div class="sidebar-footer">
      <div class="model-badge">
        <span class="model-dot"></span>
        <span id="modelLabel">gemma2-9b-it</span>
      </div>
      <select id="modelSelect" class="model-select">
        <option value="gemma2-9b-it">Gemma 2 9B</option>
        <option value="llama-3.3-70b-versatile">LLaMA 3.3 70B</option>
        <option value="mixtral-8x7b-32768">Mixtral 8×7B</option>
        <option value="llama3-70b-8192">LLaMA3 70B</option>
      </select>
    </div>
  </aside>

  <!-- Main -->
  <main class="main" id="main">
    <!-- Top bar -->
    <header class="topbar">
      <button class="menu-btn" id="menuBtn">
        <span></span><span></span><span></span>
      </button>
      <div class="topbar-center">
        <div class="status-pill">
          <span class="status-dot"></span>
          ONLINE
        </div>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="clearBtn" title="Clear chat">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
        </button>
      </div>
    </header>

    <!-- Messages -->
    <div class="messages-wrap" id="messagesWrap">
      <div class="messages" id="messages">
        <!-- Welcome screen -->
        <div class="welcome" id="welcome">
          <div class="welcome-icon">
            <div class="pulse-ring"></div>
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/></svg>
          </div>
          <h1 class="welcome-title">NEXUS AI</h1>
          <p class="welcome-sub">Next-generation conversational interface.<br/>Ask anything. Think deeper.</p>
          <div class="suggestions">
            <button class="suggestion-chip" data-text="Explain quantum entanglement simply">⚛ Quantum physics</button>
            <button class="suggestion-chip" data-text="Write a Python script to scrape domain prices">🐍 Code something</button>
            <button class="suggestion-chip" data-text="What domains in AI niche are worth investing in 2025?">🌐 Domain investing</button>
            <button class="suggestion-chip" data-text="Best crypto trading strategies for memecoins?">₿ Crypto alpha</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Input area -->
    <div class="input-area">
      <div class="input-wrap">
        <div class="input-box" id="inputBox">
          <textarea
            id="userInput"
            placeholder="Type your message..."
            rows="1"
            autocomplete="off"
            spellcheck="false"
          ></textarea>
          <div class="input-actions">
            <button class="send-btn" id="sendBtn" disabled>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
          </div>
        </div>
        <div class="input-hint">Press <kbd>Enter</kbd> to send · <kbd>Shift+Enter</kbd> for new line</div>
      </div>
    </div>
  </main>

  <!-- Typing indicator template -->
  <template id="typingTpl">
    <div class="msg msg-ai typing-msg" id="typingIndicator">
      <div class="msg-avatar">N</div>
      <div class="msg-bubble">
        <div class="typing-dots">
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>
  </template>

  <script src="js/app.js"></script>
</body>
</html>
