<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PRIME AI</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07070f;--bg2:#0d0d1a;--surface:#141428;--surface2:#1a1a32;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);
  --accent:#00f5a0;--accent2:#00d9f5;--accent3:#b060ff;
  --text:#e8e8f5;--text2:#8888aa;
  --font:'Syne',sans-serif;--mono:'Space Mono',monospace;
  --r:14px;--rs:8px;--sw:260px;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.6}

/* AMBIENT */
.ambient{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.12;animation:drift 20s ease-in-out infinite alternate}
.orb1{width:700px;height:700px;background:radial-gradient(circle,#00f5a0,transparent);top:-250px;left:-250px;animation-duration:28s}
.orb2{width:500px;height:500px;background:radial-gradient(circle,#00d9f5,transparent);bottom:-150px;right:-150px;animation-duration:22s;animation-delay:-8s}
.orb3{width:350px;height:350px;background:radial-gradient(circle,#b060ff,transparent);top:40%;left:40%;opacity:.07;animation-duration:18s;animation-delay:-4s}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.025) 1px,transparent 1px);background-size:44px 44px}
@keyframes drift{0%{transform:translate(0,0) scale(1)}100%{transform:translate(50px,35px) scale(1.08)}}

/* LAYOUT */
body{display:flex;position:relative;z-index:1}

/* SIDEBAR */
.sidebar{
  width:var(--sw);min-width:var(--sw);height:100vh;
  background:rgba(13,13,26,0.95);border-right:1px solid var(--border);
  display:flex;flex-direction:column;position:relative;z-index:10;
  transition:width .25s cubic-bezier(.4,0,.2,1),min-width .25s cubic-bezier(.4,0,.2,1),transform .25s cubic-bezier(.4,0,.2,1);
  overflow:hidden;backdrop-filter:blur(20px);
}
.sidebar.collapsed{width:0;min-width:0}
.sb-head{display:flex;align-items:center;justify-content:space-between;padding:18px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.logo{display:flex;align-items:center;gap:10px}
.logo-mark{
  width:34px;height:34px;border-radius:9px;flex-shrink:0;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-weight:700;font-size:16px;color:#000;
}
.logo-text{font-size:17px;font-weight:800;letter-spacing:.1em;white-space:nowrap}
.toggle-btn{
  width:30px;height:30px;border:1px solid var(--border2);border-radius:6px;
  background:none;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;flex-shrink:0;transition:.2s;
}
.toggle-btn:hover{border-color:var(--accent)}
.toggle-btn span{display:block;width:13px;height:1.5px;background:var(--text2);border-radius:2px}
.new-btn{
  margin:14px;padding:11px 14px;border:1px solid rgba(0,245,160,.3);
  background:rgba(0,245,160,.07);border-radius:var(--rs);color:var(--accent);
  font-family:var(--font);font-weight:700;font-size:13px;letter-spacing:.04em;
  cursor:pointer;display:flex;align-items:center;gap:8px;transition:.2s;white-space:nowrap;
}
.new-btn:hover{background:rgba(0,245,160,.14);border-color:var(--accent);transform:translateY(-1px)}
.new-btn svg{flex-shrink:0}
.sec-label{padding:0 16px 8px;font-size:10px;font-weight:700;letter-spacing:.15em;color:var(--text2);font-family:var(--mono)}
.history{flex:1;overflow-y:auto;padding:0 8px;display:flex;flex-direction:column;gap:2px}
.history::-webkit-scrollbar{width:3px}
.history::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px}
.h-item{
  padding:9px 10px;border-radius:6px;cursor:pointer;transition:.2s;
  color:var(--text2);font-size:13px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;border:1px solid transparent;display:flex;align-items:center;gap:8px;
}
.h-item:hover{background:var(--surface);color:var(--text)}
.h-item.active{background:var(--surface2);border-color:var(--border2);color:var(--text)}
.sb-foot{padding:14px;border-top:1px solid var(--border);flex-shrink:0}
.model-badge{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mdot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);animation:pdot 2s ease-in-out infinite;flex-shrink:0}
@keyframes pdot{0%,100%{opacity:1;box-shadow:0 0 8px var(--accent)}50%{opacity:.5;box-shadow:0 0 3px var(--accent)}}
#modelLabel{font-family:var(--mono);font-size:11px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.model-sel{
  width:100%;background:var(--surface);border:1px solid var(--border2);border-radius:var(--rs);
  color:var(--text);padding:8px 10px;font-family:var(--font);font-size:12px;cursor:pointer;outline:none;
}
.model-sel:hover,.model-sel:focus{border-color:var(--accent)}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden;position:relative}

/* TOPBAR */
.topbar{
  height:54px;display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;border-bottom:1px solid var(--border);
  background:rgba(7,7,15,0.85);backdrop-filter:blur(20px);flex-shrink:0;z-index:5;
}
.menu-btn{display:none;flex-direction:column;gap:5px;background:none;border:none;cursor:pointer;padding:4px}
.menu-btn span{display:block;width:20px;height:1.5px;background:var(--text2);border-radius:2px}
.status-pill{
  display:flex;align-items:center;gap:6px;padding:4px 12px;
  border-radius:99px;border:1px solid rgba(0,245,160,.2);background:rgba(0,245,160,.05);
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--accent);
}
.sdot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pdot 2s ease-in-out infinite}
.icon-btn{
  width:34px;height:34px;border-radius:var(--rs);background:none;border:1px solid var(--border);
  color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;
}
.icon-btn:hover{border-color:#ff4466;color:#ff4466}

/* MESSAGES */
.msgs-wrap{flex:1;overflow-y:auto;padding:24px 18px;scroll-behavior:smooth}
.msgs-wrap::-webkit-scrollbar{width:4px}
.msgs-wrap::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px}
.msgs{max-width:740px;margin:0 auto;display:flex;flex-direction:column;gap:22px}

/* WELCOME */
.welcome{display:flex;flex-direction:column;align-items:center;text-align:center;padding:50px 20px 30px;animation:fadeUp .6s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.w-icon{position:relative;width:80px;height:80px;display:flex;align-items:center;justify-content:center;margin-bottom:22px;color:var(--accent)}
.pulse{position:absolute;inset:-10px;border-radius:50%;border:2px solid var(--accent);opacity:.3;animation:pring 2.5s ease-in-out infinite}
.pulse2{position:absolute;inset:-20px;border-radius:50%;border:1px solid var(--accent);opacity:.1;animation:pring 2.5s ease-in-out infinite;animation-delay:.5s}
@keyframes pring{0%,100%{transform:scale(1);opacity:.3}50%{transform:scale(1.1);opacity:.08}}
.w-title{
  font-size:clamp(28px,8vw,52px);font-weight:800;letter-spacing:.08em;
  background:linear-gradient(135deg,var(--accent),var(--accent2) 50%,var(--accent));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:12px;
}
.w-sub{font-size:14px;color:var(--text2);line-height:1.8;margin-bottom:32px;max-width:340px}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chip{
  padding:9px 16px;border-radius:99px;border:1px solid var(--border2);
  background:var(--surface);color:var(--text2);font-family:var(--font);font-size:13px;
  cursor:pointer;transition:.2s;white-space:nowrap;
}
.chip:hover{border-color:var(--accent);color:var(--accent);background:rgba(0,245,160,.06);transform:translateY(-2px)}

/* MESSAGES */
.msg{display:flex;gap:12px;animation:fadeUp .3s ease both}
.msg-user{flex-direction:row-reverse}
.avatar{
  width:34px;height:34px;border-radius:9px;display:flex;align-items:center;
  justify-content:center;font-weight:700;font-size:12px;flex-shrink:0;font-family:var(--mono);
}
.msg-ai .avatar{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000}
.msg-user .avatar{background:linear-gradient(135deg,#6030c0,#9050f0);color:#fff}
.msg-body{flex:1;min-width:0}
.msg-meta{font-size:11px;color:var(--text2);font-family:var(--mono);margin-bottom:5px;letter-spacing:.04em}
.msg-user .msg-meta{text-align:right}
.bubble{
  padding:13px 16px;border-radius:var(--r);line-height:1.75;font-size:14.5px;
  max-width:100%;word-break:break-word;
}
.msg-ai .bubble{background:var(--surface);border:1px solid var(--border);color:var(--text);border-top-left-radius:4px}
.msg-user .bubble{
  background:linear-gradient(135deg,#131c35,#161a30);
  border:1px solid rgba(96,48,192,.35);color:var(--text);border-top-right-radius:4px;
}
.msg-user .msg-body{display:flex;flex-direction:column;align-items:flex-end}

/* Markdown */
.bubble h1,.bubble h2,.bubble h3{font-family:var(--font);font-weight:700;margin:12px 0 6px;line-height:1.3}
.bubble h1{font-size:18px}.bubble h2{font-size:16px}.bubble h3{font-size:14px;color:var(--accent)}
.bubble p{margin-bottom:10px}.bubble p:last-child{margin-bottom:0}
.bubble ul,.bubble ol{padding-left:20px;margin-bottom:10px}.bubble li{margin-bottom:4px}
.bubble code{font-family:var(--mono);font-size:12px;background:rgba(0,245,160,.08);color:var(--accent);padding:2px 6px;border-radius:4px;border:1px solid rgba(0,245,160,.15)}
.bubble pre{background:#080814;border:1px solid var(--border2);border-radius:10px;padding:14px;overflow-x:auto;margin:10px 0}
.bubble pre code{background:none;border:none;padding:0;font-size:12.5px;color:#90e0b0}
.bubble strong{color:var(--accent2);font-weight:700}
.bubble em{font-style:italic}
.bubble blockquote{border-left:3px solid var(--accent);padding-left:13px;margin:10px 0;color:var(--text2);font-style:italic}

/* TYPING */
.typing-dots{display:flex;align-items:center;gap:6px;height:22px}
.typing-dots span{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:blink 1.2s ease-in-out infinite}
.typing-dots span:nth-child(2){animation-delay:.2s}
.typing-dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
.streaming-cursor::after{content:'▊';color:var(--accent);animation:blink-c .7s step-end infinite;margin-left:2px}
@keyframes blink-c{0%,100%{opacity:1}50%{opacity:0}}

/* INPUT */
.input-area{
  padding:14px 18px 18px;border-top:1px solid var(--border);
  background:rgba(7,7,15,.9);backdrop-filter:blur(20px);flex-shrink:0;
}
.input-wrap{max-width:740px;margin:0 auto}
.input-box{
  display:flex;align-items:flex-end;gap:10px;background:var(--surface);
  border:1px solid var(--border2);border-radius:var(--r);padding:11px 13px;transition:.2s;
}
.input-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 1px rgba(0,245,160,.12),0 0 24px rgba(0,245,160,.06)}
.input-box textarea{
  flex:1;background:none;border:none;outline:none;color:var(--text);
  font-family:var(--font);font-size:14.5px;line-height:1.6;resize:none;max-height:160px;overflow-y:auto;
}
.input-box textarea::placeholder{color:var(--text2)}
.send-btn{
  width:36px;height:36px;border-radius:9px;border:none;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#000;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;flex-shrink:0;
}
.send-btn:hover:not(:disabled){transform:scale(1.06);box-shadow:0 0 20px rgba(0,245,160,.4)}
.send-btn:disabled{opacity:.35;cursor:not-allowed;background:var(--surface2);color:var(--text2)}
.hint{margin-top:7px;font-size:11px;color:var(--text2);font-family:var(--mono)}
.hint kbd{display:inline-block;padding:1px 5px;border:1px solid var(--border2);border-radius:4px;font-size:10px;background:var(--surface)}
.msg-err .bubble{background:rgba(255,50,80,.08);border-color:rgba(255,50,80,.25);color:#ff7090}

/* TOAST */
.toast{
  position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(16px);
  background:var(--surface2);border:1px solid var(--border2);border-radius:99px;
  padding:9px 18px;font-size:12px;color:var(--text2);z-index:999;
  opacity:0;transition:all .3s ease;pointer-events:none;font-family:var(--mono);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* OVERLAY */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:99}
.overlay.show{display:block}

/* MOBILE */
@media(max-width:768px){
  .sidebar{
    position:fixed;top:0;left:0;bottom:0;z-index:100;
    width:var(--sw)!important;min-width:var(--sw)!important;
    transform:translateX(-100%);
  }
  .sidebar.open{transform:translateX(0);box-shadow:4px 0 40px rgba(0,0,0,.6)}
  .menu-btn{display:flex}
  .toggle-btn{display:none}
}
</style>
</head>
<body>

<!-- Ambient -->
<div class="ambient">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
  <div class="grid"></div>
</div>

<div class="overlay" id="overlay"></div>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
  <div class="sb-head">
    <div class="logo">
      <div class="logo-mark">P</div>
      <span class="logo-text">PRIME</span>
    </div>
    <button class="toggle-btn" id="toggleBtn" title="Toggle sidebar">
      <span></span><span></span>
    </button>
  </div>
  <button class="new-btn" id="newBtn">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    New Conversation
  </button>
  <div class="sec-label">RECENT</div>
  <nav class="history" id="history"></nav>
  <div class="sb-foot">
    <div class="model-badge">
      <div class="mdot"></div>
      <span id="modelLabel">Gemma 2 9B</span>
    </div>
    <select class="model-sel" id="modelSel">
      <option value="gemma2-9b-it">Gemma 2 9B</option>
      <option value="llama-3.3-70b-versatile">LLaMA 3.3 70B</option>
      <option value="mixtral-8x7b-32768">Mixtral 8×7B</option>
      <option value="llama3-70b-8192">LLaMA3 70B</option>
    </select>
  </div>
</aside>

<!-- Main -->
<main class="main">
  <header class="topbar">
    <button class="menu-btn" id="menuBtn"><span></span><span></span><span></span></button>
    <div class="status-pill"><div class="sdot"></div>ONLINE</div>
    <button class="icon-btn" id="clearBtn" title="Clear chat">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
    </button>
  </header>

  <div class="msgs-wrap" id="msgsWrap">
    <div class="msgs" id="msgs"></div>
  </div>

  <div class="input-area">
    <div class="input-wrap">
      <div class="input-box">
        <textarea id="input" placeholder="Type your message..." rows="1" autocomplete="off" spellcheck="false"></textarea>
        <button class="send-btn" id="sendBtn" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
      <div class="hint">Press <kbd>Enter</kbd> to send · <kbd>Shift+Enter</kbd> new line</div>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
const API_KEY = "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";
const API_URL = "https://api.groq.com/openai/v1/chat/completions";

const state = {
  sessions: JSON.parse(localStorage.getItem("nx_s") || "[]"),
  cid: null,
  busy: false
};

const $ = id => document.getElementById(id);
const msgsEl   = $("msgs");
const msgsWrap = $("msgsWrap");
const inputEl  = $("input");
const sendBtn  = $("sendBtn");
const sidebar  = $("sidebar");
const overlay  = $("overlay");
const histEl   = $("history");
const modelSel = $("modelSel");

function session(){ return state.sessions.find(s=>s.id===state.cid)||null }
function save(){ localStorage.setItem("nx_s", JSON.stringify(state.sessions)) }

function newSession(){
  const s={ id: Date.now()+"", title:"New conversation", model:modelSel.value, messages:[], ts:Date.now() };
  state.sessions.unshift(s); state.cid=s.id; save(); renderHistory(); return s;
}

function esc(t){ return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;") }

function md(t){
  return t
    .replace(/```(\w*)\n?([\s\S]*?)```/g,(_,l,c)=>`<pre><code>${esc(c.trim())}</code></pre>`)
    .replace(/`([^`]+)`/g,(_,c)=>`<code>${esc(c)}</code>`)
    .replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
    .replace(/\*(.+?)\*/g,"<em>$1</em>")
    .replace(/^### (.+)$/gm,"<h3>$1</h3>")
    .replace(/^## (.+)$/gm,"<h2>$1</h2>")
    .replace(/^# (.+)$/gm,"<h1>$1</h1>")
    .replace(/^> (.+)$/gm,"<blockquote>$1</blockquote>")
    .replace(/^[*\-] (.+)$/gm,"<li>$1</li>")
    .replace(/(<li>[\s\S]+?<\/li>)/g,"<ul>$1</ul>")
    .replace(/\n\n/g,"</p><p>").replace(/\n/g,"<br/>")
    .replace(/^(?![<])(.+)/,"<p>$1</p>");
}

function renderHistory(){
  histEl.innerHTML="";
  if(!state.sessions.length){
    histEl.innerHTML='<div style="padding:10px;color:var(--text2);font-size:12px;font-family:var(--mono)">No conversations yet</div>';
    return;
  }
  state.sessions.forEach(s=>{
    const d=document.createElement("div");
    d.className="h-item"+(s.id===state.cid?" active":"");
    d.innerHTML=`<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="opacity:.5;flex-shrink:0"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>${esc(s.title)}`;
    d.title=s.title;
    d.addEventListener("click",()=>{ state.cid=s.id; renderHistory(); renderMsgs(); closeMobile(); });
    histEl.appendChild(d);
  });
}

function renderMsgs(){
  const s=session();
  msgsEl.innerHTML="";
  if(!s||!s.messages.length){ showWelcome(); return; }
  s.messages.forEach(m=>appendMsg(m.role,m.content,false));
  scrollBot();
}

function showWelcome(){
  msgsEl.innerHTML=`<div class="welcome">
    <div class="w-icon">
      <div class="pulse"></div><div class="pulse2"></div>
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/>
        <path d="M12 2v2M12 20v2M2 12h2M20 12h2"/>
      </svg>
    </div>
    <h1 class="w-title">PRIME AI</h1>
    <p class="w-sub">Next-generation conversational interface.<br/>Ask anything. Think deeper.</p>
    <div class="chips">
      <button class="chip" data-t="Explain quantum entanglement simply">⚛ Quantum physics</button>
      <button class="chip" data-t="Write a Python script to analyze domain backlinks">🐍 Code something</button>
      <button class="chip" data-t="What .ai domains are worth investing in 2025?">🌐 Domain investing</button>
      <button class="chip" data-t="Best memecoin trading strategies for quick gains?">₿ Crypto alpha</button>
    </div>
  </div>`;
  msgsEl.querySelectorAll(".chip").forEach(c=>{
    c.addEventListener("click",()=>{ inputEl.value=c.dataset.t; resize(); sendBtn.disabled=false; inputEl.focus(); });
  });
}

function appendMsg(role, content, animate=true){
  document.querySelector(".welcome")?.remove();
  const isUser=role==="user";
  const now=new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
  const el=document.createElement("div");
  el.className=`msg ${isUser?"msg-user":"msg-ai"}`;
  if(!animate) el.style.animation="none";
  el.innerHTML=`
    <div class="avatar">${isUser?"YOU":"N"}</div>
    <div class="msg-body">
      <div class="msg-meta">${isUser?"You":"PRIME"} · ${now}</div>
      <div class="bubble">${isUser?esc(content):md(content)}</div>
    </div>`;
  msgsEl.appendChild(el);
  if(animate) scrollBot();
  return el;
}

function scrollBot(){ msgsWrap.scrollTo({top:msgsWrap.scrollHeight,behavior:"smooth"}) }

function showTyping(){
  const el=document.createElement("div");
  el.className="msg msg-ai"; el.id="typing";
  el.innerHTML=`<div class="avatar">P</div><div class="msg-body"><div class="bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div></div>`;
  msgsEl.appendChild(el); scrollBot();
}
function hideTyping(){ $("typing")?.remove() }

async function send(text){
  text=text.trim();
  if(!text||state.busy) return;
  if(!state.cid) newSession();
  const s=session();

  s.messages.push({role:"user",content:text});
  if(s.title==="New conversation") s.title=text.slice(0,38)+(text.length>38?"…":"");
  save(); appendMsg("user",text); renderHistory();

  inputEl.value=""; inputEl.style.height="auto";
  sendBtn.disabled=true; state.busy=true;
  showTyping();

  try{
    const res=await fetch(API_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":`Bearer ${API_KEY}`},
      body:JSON.stringify({
        model:s.model||modelSel.value,
        messages:[
          {role:"system",content:"You are PRIME, a sharp and elegant AI assistant. Be concise, precise, and insightful. Use markdown formatting when helpful."},
          ...s.messages
        ],
        stream:true, max_tokens:2048, temperature:0.7
      })
    });
    if(!res.ok){ const e=await res.json().catch(()=>({})); throw new Error(e.error?.message||`HTTP ${res.status}`) }

    hideTyping();
    const now=new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
    const mel=document.createElement("div");
    mel.className="msg msg-ai";
    mel.innerHTML=`<div class="avatar">P</div><div class="msg-body"><div class="msg-meta">PRIME · ${now}</div><div class="bubble streaming-cursor"></div></div>`;
    msgsEl.appendChild(mel);
    const bbl=mel.querySelector(".bubble");

    const reader=res.body.getReader();
    const dec=new TextDecoder();
    let full="";
    while(true){
      const{done,value}=await reader.read();
      if(done) break;
      const lines=dec.decode(value).split("\n").filter(l=>l.startsWith("data: "));
      for(const line of lines){
        const data=line.slice(6);
        if(data==="[DONE]") break;
        try{ const p=JSON.parse(data); full+=p.choices?.[0]?.delta?.content||""; bbl.innerHTML=md(full); scrollBot(); }catch(_){}
      }
    }
    bbl.classList.remove("streaming-cursor");
    s.messages.push({role:"assistant",content:full}); save();
  }catch(e){
    hideTyping();
    const el=document.createElement("div");
    el.className="msg msg-ai msg-err";
    el.innerHTML=`<div class="avatar">!</div><div class="msg-body"><div class="bubble">⚠ ${esc(e.message)}</div></div>`;
    msgsEl.appendChild(el); scrollBot();
  }finally{
    state.busy=false; sendBtn.disabled=!inputEl.value.trim();
  }
}

function resize(){ inputEl.style.height="auto"; inputEl.style.height=Math.min(inputEl.scrollHeight,160)+"px" }
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2400) }
function closeMobile(){ sidebar.classList.remove("open"); overlay.classList.remove("show") }

$("toggleBtn").addEventListener("click",()=>sidebar.classList.toggle("collapsed"));
$("menuBtn").addEventListener("click",()=>{ sidebar.classList.toggle("open"); overlay.classList.toggle("show") });
overlay.addEventListener("click", closeMobile);
$("newBtn").addEventListener("click",()=>{ newSession(); renderMsgs(); closeMobile(); inputEl.focus() });
$("clearBtn").addEventListener("click",()=>{
  const s=session(); if(!s||!s.messages.length) return;
  s.messages=[]; s.title="New conversation"; save(); renderHistory(); renderMsgs(); toast("Chat cleared");
});
modelSel.addEventListener("change",()=>{
  $("modelLabel").textContent=modelSel.options[modelSel.selectedIndex].text;
  const s=session(); if(s){ s.model=modelSel.value; save() }
});
inputEl.addEventListener("input",()=>{ resize(); sendBtn.disabled=!inputEl.value.trim()||state.busy });
inputEl.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); if(!sendBtn.disabled) send(inputEl.value) } });
sendBtn.addEventListener("click",()=>send(inputEl.value));

// Init
(function(){
  if(state.sessions.length){ state.cid=state.sessions[0].id }
  else { newSession() }
  renderHistory(); renderMsgs(); inputEl.focus();
  $("modelLabel").textContent=modelSel.options[modelSel.selectedIndex].text;
})();
</script>
</body>
</html>
